name: Package draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing draft release tag"
        required: true
        default: v0.2.4
permissions:
  contents: write
concurrency:
  group: package-draft
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Refuse published or mismatched destinations
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install -r requirements-test.txt
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:release
      - run: npm run release:package
      - name: Verify downloadable assets
        run: |
          cd "release/$RELEASE_TAG"
          sha256sum -c SHA256SUMS.txt
      - name: Attach assets without publishing or replacing existing assets
        run: gh release upload "$RELEASE_TAG" "release/$RELEASE_TAG/"* --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verification-and-assets
          path: |
            qa/release-*
            release/
